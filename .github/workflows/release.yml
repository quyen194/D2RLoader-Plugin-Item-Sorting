# Builds d2rl-quyen19492-item-sorting.dll (Release, x64) and publishes a GitHub
# Release
# whenever a version tag is pushed, e.g.:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Ordinary commits/pushes to any branch do NOT trigger this workflow -- only
# a pushed "v*" tag does, so Releases stay something you opt into.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      # Checked out as a sibling of PluginSDK below, mirroring the local
      # D2RLoader-Plugins-Dev/{Quyen19492-Item-Sorting,PluginSDK} layout that
      # CMakeLists.txt's `../PluginSDK` add_subdirectory() expects.
      - name: Checkout Quyen19492-Item-Sorting
        uses: actions/checkout@v4
        with:
          path: Quyen19492-Item-Sorting

      # The DLL's embedded version comes from CMakeLists.txt's project()
      # line (tools/set_version.py); refuse to release a tag that disagrees.
      - name: Check tag matches project version
        working-directory: Quyen19492-Item-Sorting
        shell: pwsh
        run: |
          $version = (python tools/set_version.py).Trim()
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") { throw "tag $tag does not match CMakeLists.txt version $version -- run tools/set_version.py" }

      - name: Checkout PluginSDK
        uses: actions/checkout@v4
        with:
          repository: D2RLoader/PluginSDK
          path: PluginSDK

      - name: Set up MSVC (x64) dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        working-directory: Quyen19492-Item-Sorting
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: Quyen19492-Item-Sorting
        run: cmake --build build --config Release

      # CMakeLists.txt's post-build steps already filled deploy/:
      #   d2rloader/plugins/  d2rl-quyen19492-item-sorting.dll + .mpq/ folder
      #   d2rloader/config/   quyen19492-item-sorting.toml
      #   README.md           install guide (packaging/README.md)
      #   patch_mod_stash_layout.py
      # Zip deploy/'s contents as-is: the d2rloader folder goes into <game>/,
      # the README explains the rest.
      - name: Package deploy/
        working-directory: Quyen19492-Item-Sorting
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "Quyen19492ItemSorting-$tag.zip"
          foreach ($f in @("deploy/d2rloader", "deploy/README.md", "deploy/patch_mod_stash_layout.py")) {
            if (-not (Test-Path $f)) { throw "missing $f -- did the post-build copy run?" }
          }
          Compress-Archive -Path "deploy/d2rloader", "deploy/README.md", "deploy/patch_mod_stash_layout.py" -DestinationPath $zipName
          echo "ZIP_PATH=Quyen19492-Item-Sorting/$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_PATH }}
            Quyen19492-Item-Sorting/packaging/README.md
          generate_release_notes: true
