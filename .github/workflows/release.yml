# Builds d2rl-quyen194-item-sorting.dll (Release, x64) and publishes a GitHub
# Release
# whenever a version tag is pushed, e.g.:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Ordinary commits/pushes to any branch do NOT trigger this workflow -- only
# a pushed "v*" tag does, so Releases stay something you opt into.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      # Checked out as a sibling of PluginSDK below, mirroring the local
      # D2RLoader-Plugins-Dev/{Quyen194-Item-Sorting,PluginSDK} layout that
      # CMakeLists.txt's `../PluginSDK` add_subdirectory() expects.
      - name: Checkout Quyen194-Item-Sorting
        uses: actions/checkout@v4
        with:
          path: Quyen194-Item-Sorting

      - name: Checkout PluginSDK
        uses: actions/checkout@v4
        with:
          repository: D2RLoader/PluginSDK
          path: PluginSDK

      - name: Set up MSVC (x64) dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        working-directory: Quyen194-Item-Sorting
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: Quyen194-Item-Sorting
        run: cmake --build build --config Release

      # CMakeLists.txt's post-build steps already copied
      # d2rl-quyen194-item-sorting.dll and its companion
      # d2rl-quyen194-item-sorting.mpq/ folder into deploy/d2rloader/plugins/ --
      # zip that folder as-is so the Release asset is literally
      # "extract into <game>/".
      - name: Package deploy/d2rloader
        working-directory: Quyen194-Item-Sorting
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "Quyen194ItemSorting-$tag.zip"
          Compress-Archive -Path "deploy/d2rloader" -DestinationPath $zipName
          echo "ZIP_PATH=Quyen194-Item-Sorting/$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
          generate_release_notes: true
