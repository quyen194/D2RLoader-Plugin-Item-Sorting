# Default configuration for the Remote Stash Sorting plugin.
# D2RLoader creates <scope>/d2rloader/config/remote-stash-sorting.toml from
# this file the first time the plugin loads; it never overwrites a config
# the user has already edited.

[remote-stash-sorting]
enabled = true

# The SDK has no query for "how many active/normal shared-stash tabs exist"
# (see README "Known gaps"), so this must be set by hand to match your
# actual shared stash. Auto Sort fails cleanly (with a toast + log message)
# rather than guessing if this is too low; it is harmless to set it a bit
# higher than the real count.
shared_stash_tab_count = 200

# Reserved leading tabs that Auto Sort and the padding pass never touch
# (e.g. tabs you manage by hand). Mirrors the save-editor's startTab.
start_tab = 0

# After sorting + category padding, pull this many empty tabs to the front
# of the active range (right after start_tab). Mirrors blankTabsAtStart /
# _ssAddBlankTabsAtStart. Set to 0 to disable.
blank_tabs_at_start = 3

# Before sorting, relabel already-empty tabs (within the active range) to
# the end of that range so Auto Sort has a clean run of empty tabs to fill
# from. Mirrors compactEmptyTabsFirst / _ssCompactEmptyTabsToEnd. Leave
# true unless you have a reason to preserve empty-tab positions as-is.
compact_empty_tabs_first = true

# After each category finishes, add one extra "breathing" blank tab once
# that category's last used tab is at least this % full. Accepts "never",
# "always", or a number 0-100. Mirrors addEmptyPageWhen / _ssWantsEmptyPage.
# Overridable per category below.
add_empty_page_when = 30

# Notification style after Auto Sort / Add Blank Page / Remove Current Page
# finish. v1 always shows the plugin's own toast panel with a Close button
# (the WidgetService has no way to push fresh text into an already-open
# widget, so there is no auto-dismiss timer yet -- see README). Exact item
# and tab counts go to the plugin's log file, not the toast.
notification_channel = "toast"
notification_seconds = 4 # reserved for a future auto-dismiss timer; unused in v1

# Debug aid only -- leave false normally. When true, every UI message the
# plugin's listener sees (ours, other plugins', and D2R's own native
# panel/button messages) is written to the plugin log as target/command/text.
# Turn this on, open/close/switch tabs on the Shared Stash in-game, then check
# the log to find the exact native message D2R fires for those actions (there
# is no documented list of them -- see README "Known gaps" #8). This is a
# firehose (fires on almost every UI click), so turn it back off once done.
debug_log_ui_messages = false

# Grid size per shared-stash tab. 16x13 is confirmed from the
# D2R-Reimagined-Save-Editor's renderSharedStashTabs; override here only if
# live testing finds a mismatch for your game version.
[remote-stash-sorting.grid]
width = 16
height = 13

# Auto-sort layout: one entry per category, in the order tabs are filled.
# Mirrors SS_AUTO_LAYOUT from the save-editor 1:1. mode_id must match an id
# sort_engine.cpp knows about (see DefaultLayout()/kBuiltinModes).
[[remote-stash-sorting.layout]]
mode_id = "uniqueGear"
min_tabs = 5

[[remote-stash-sorting.layout]]
mode_id = "uniqueRingAmu"
min_tabs = 1

[[remote-stash-sorting.layout]]
mode_id = "rareRingAmu"
min_tabs = 1

[[remote-stash-sorting.layout]]
mode_id = "magicRingAmu"
min_tabs = 1

[[remote-stash-sorting.layout]]
mode_id = "uniqueCharm"
min_tabs = 1

[[remote-stash-sorting.layout]]
mode_id = "magicCharm"
min_tabs = 2

[[remote-stash-sorting.layout]]
mode_id = "uniqueJewel"
min_tabs = 1

[[remote-stash-sorting.layout]]
mode_id = "rareMagicJewel"
min_tabs = 1

[[remote-stash-sorting.layout]]
mode_id = "set"
min_tabs = 6
# Reference default: always add a breathing page after Set gear (its tabs
# tend to fill unevenly since full sets are rare).
add_empty_page_when = "always"

[[remote-stash-sorting.layout]]
mode_id = "rareGear"
min_tabs = 1
# Reference default: never add a breathing page after Rare gear (it's
# usually the last/overflow category, so padding it just wastes tabs).
add_empty_page_when = "never"

# This plugin only rearranges the local player's own shared stash, so its
# settings do not affect other players and are not listed under [d2rl].
