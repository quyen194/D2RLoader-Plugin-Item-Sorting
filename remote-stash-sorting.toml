# Default configuration for the Remote Stash Sorting plugin.
# D2RLoader creates <scope>/d2rloader/config/remote-stash-sorting.toml from
# this file the first time the plugin loads; it never overwrites a config
# the user has already edited.

[remote-stash-sorting]
enabled = true

# The SDK has no query for "how many active/normal shared-stash tabs exist"
# (see README "Known gaps"), so this must be set by hand to match your
# actual shared stash. Auto Sort fails cleanly (with a toast + log message)
# rather than guessing if this is too low; it is harmless to set it a bit
# higher than the real count.
shared_stash_tab_count = 200

# Notification style after Auto Sort / Add Blank Page / Remove Current Page
# finish. v1 always shows the plugin's own toast panel with a Close button
# (the WidgetService has no way to push fresh text into an already-open
# widget, so there is no auto-dismiss timer yet -- see README). Exact item
# and tab counts go to the plugin's log file, not the toast.
notification_channel = "toast"
notification_seconds = 4 # reserved for a future auto-dismiss timer; unused in v1

# Grid size per shared-stash tab. 16x13 is confirmed from the
# D2R-Reimagined-Save-Editor's renderSharedStashTabs; override here only if
# live testing finds a mismatch for your game version.
[remote-stash-sorting.grid]
width = 16
height = 13

# Auto-sort layout: one entry per category, in the order tabs are filled.
# Mirrors SS_AUTO_LAYOUT from the save-editor 1:1. mode_id must match an id
# sort_engine.cpp knows about (see DefaultLayout()/kBuiltinModes).
[[remote-stash-sorting.layout]]
mode_id = "uniqueGear"
min_tabs = 5

[[remote-stash-sorting.layout]]
mode_id = "uniqueRingAmu"
min_tabs = 1

[[remote-stash-sorting.layout]]
mode_id = "rareRingAmu"
min_tabs = 1

[[remote-stash-sorting.layout]]
mode_id = "magicRingAmu"
min_tabs = 1

[[remote-stash-sorting.layout]]
mode_id = "uniqueCharm"
min_tabs = 1

[[remote-stash-sorting.layout]]
mode_id = "magicCharm"
min_tabs = 2

[[remote-stash-sorting.layout]]
mode_id = "uniqueJewel"
min_tabs = 1

[[remote-stash-sorting.layout]]
mode_id = "rareMagicJewel"
min_tabs = 1

[[remote-stash-sorting.layout]]
mode_id = "set"
min_tabs = 6

[[remote-stash-sorting.layout]]
mode_id = "rareGear"
min_tabs = 1

# This plugin only rearranges the local player's own shared stash, so its
# settings do not affect other players and are not listed under [d2rl].
