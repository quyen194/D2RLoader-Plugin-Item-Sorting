# Default configuration for the Quyen19492 Item Sorting plugin.
# D2RLoader creates <scope>/d2rloader/config/quyen19492-item-sorting.toml from
# this file the first time the plugin loads; it never overwrites a config
# you've already edited.
#
# ── File structure ─────────────────────────────────────────────────────────
#   [item-sorting]                  plugin-wide settings (this block)
#   [item-sorting.shared_stash]     shared stash: Auto Sort / Add Page /
#     [[...shared_stash.layout]]             Remove Page, one entry per category
#   [item-sorting.personal_stash]   personal stash Sort
#   [item-sorting.inventory]        inventory Sort
#   [item-sorting.cube]             Horadric Cube Sort
#
# ── What reloads when, without restarting the game ─────────────────────────
#   Read ONCE, when the game starts (restart to change):
#     everything in this [item-sorting] block except notification_enabled.
#   Read again while you play:
#     every section below it. Each button press re-reads its own section
#     (the shared-stash buttons also re-read `enabled`, `add_page_enabled`
#     and `remove_page_enabled` every time the stash opens, to show/hide
#     themselves), so an edit takes effect on the next press.

[item-sorting]

# Master switch for the whole plugin -- true | false. false: the plugin loads
# but registers nothing (no actions, no inventory button, no toast); buttons
# already patched into the mod's layouts stay visible but do nothing. Read
# once at game start. To switch off just one container while playing, use
# that section's own `enabled` instead.
enabled = true

# Show a notification after any button finishes -- true | false. false: no
# toast ever opens; results still go to the plugin's log file. Re-read on
# every button press (and whenever the stash opens) -- no restart needed.
notification_enabled = true

# Notification style after any button finishes. The only accepted value right
# now is "toast", which shows the plugin's own toast panel with a Close
# button. Exact item and tab counts always go to the plugin's log file,
# regardless of this setting.
notification_channel = "toast"
notification_seconds = 4 # reserved for a future auto-dismiss timer; unused in v1

# Debug aid only -- leave false normally. When true, every UI message the
# plugin's listener sees (ours, other plugins', and the game's own native
# panel/button messages) is written to the plugin log as target/command/text.
# Turn this on, click around in-game, then check the log to find the exact
# native message the game fires. This is a firehose (fires on almost every UI
# click), so turn it back off once you're done.
debug_log_ui_messages = false

# Item classification (which gear slot/size/set/kind an item code is, used to
# sort it into the right category, in every container) normally comes from
# tables generated at build time from reference copies of the game's
# itemtypes/weapons/armor/misc/setitems.txt. Those can silently drift out of
# sync with whatever mod you actually have active (this happened for real --
# see README "Known gaps" for a Set-item bug this caused). Leave this empty
# ("") to use the embedded tables. Set it to your mod's own folder (the one
# containing a data/global/excel/ subfolder with its own itemtypes.txt etc. --
# typically the same folder as its .mpq, e.g. a loose-folder mod during dev)
# to have the plugin parse THAT mod's own txt files instead, so classification
# always matches exactly what you're running. Falls back to the embedded
# tables (with a log warning) if the path or its files can't be read.
# Example: mod_data_path = "D:\\Games\\DiabloII-Resurrected\\DiabloII-Resurrected\\mods\\Reimagined\\Reimagined.mpq"
mod_data_path = ""


# ═══════════════════════════════════════════════════════════════════════════
#  SHARED STASH  (Auto Sort / Add Page / Remove Page buttons on the Shared tab)
# ═══════════════════════════════════════════════════════════════════════════
# Everything in this section is re-read while you play: Auto Sort, Add Page
# and Remove Page each re-read it on every press, and opening the stash
# re-reads `enabled` / `add_page_enabled` / `remove_page_enabled` to show or
# hide the buttons.
[item-sorting.shared_stash]

# true | false. false hides all three shared-stash buttons (applied the next
# time the stash opens or you switch stash tabs) and makes them do nothing if
# clicked anyway. Only affects the shared stash; the personal stash, inventory
# and cube have their own `enabled`. The plugin-wide switch above still
# overrides it.
enabled = true

# Shared-stash Add Page / Remove Page buttons -- true | false. false hides
# that button (its slot in the button row stays empty) and ignores its
# action. Has no effect while `enabled` above is false (all three are hidden
# then).
add_page_enabled = false
remove_page_enabled = false

# Grid size of ONE shared-stash tab, in cells -- integers 1-16. 16 x 13 is
# the size of the game's (and Reimagined's) shared stash; only change it if
# live testing finds a mismatch for your game version.
grid_width = 16
grid_height = 13

# Integer >= 1. The SDK has no way to query how many active shared-stash tabs
# you have, so this must be set by hand to match your actual shared stash.
# Auto Sort fails cleanly (toast + log message) rather than guessing if this
# is too low. A too-high value has not been shown to be harmless either --
# see the README's "Known gaps" #3 for an open investigation into a handful
# of per-item rejections that first looked like this but turned out not to
# be.
shared_stash_tab_count = 200

# Integer >= 0. Reserved leading tabs that Auto Sort and the padding pass
# never touch -- useful if you keep a few tabs at the front you manage by
# hand and don't want the plugin to ever rearrange.
start_tab = 0

# Integer >= 0. After sorting, pull this many empty tabs up to sit right
# after start_tab, so you always have a few blank tabs handy at the front
# without having to hunt for them. 0 = disabled.
blank_tabs_at_start = 3

# true | false. Before sorting, relabel already-empty tabs (within the active
# range) so they all end up at the end of that range -- this gives Auto Sort
# a clean, contiguous run of empty tabs to fill from instead of scattered
# gaps. Leave true unless you have a specific reason to keep empty tabs
# exactly where they currently are.
compact_empty_tabs_first = true

# "never" | "always" | a number 0-100. Global default for the per-category
# add_empty_page_when below -- only used by a category that doesn't set its
# own. Every category in this file already sets its own value, so this is
# effectively unused as shipped; it only matters if you add a new [[layout]]
# entry without one. See the per-category explanation below.
add_empty_page_when = "never"

# ── Auto-sort layout ────────────────────────────────────────────────────
# One entry per category, in the order tabs are filled -- the first entry's
# category claims the first tab(s), the next entry starts right after it,
# and so on. If you remove an entry from this list entirely, the items it
# would have matched don't disappear -- they fall through to "unclassified"
# instead, same as any other item this file doesn't give a dedicated
# category to.
#
# Every [[item-sorting.shared_stash.layout]] entry accepts:
#
#   mode_id              -- required. One of: set, uniqueGear, uniqueRingAmu,
#                            rareRingAmu, magicRingAmu, uniqueCharm,
#                            magicCharm, uniqueJewel, rareMagicJewel,
#                            rareGear, magicGear, superiorGear, normalGear,
#                            unclassified -- or one of the misc categories
#                            rune, gem, potion, tool, quest (see the
#                            single-grid sections at the end of this file).
#
#   min_tabs              -- reserved tabs before this category starts
#                            borrowing more from the rest of the stash;
#                            0 = borrow-only, no fixed reservation.
#
#   add_empty_page_when   -- "never", "always", or a number 0-100. Adds one
#                            extra blank "breathing" tab right after this
#                            category's run once its last used tab is at
#                            least this full (a number), always (regardless
#                            of fill), or never.
#
#   sort_keys              -- this category's sort order. A list of key
#                            names, most significant first; prefix a name
#                            with "-" to sort that key descending instead
#                            of ascending.
#
#                            Keys accepted by every category:
#                              "reqLevel"  -- required level to equip/use
#                              "ilvl"      -- item level
#                              "name"      -- base item name, alphabetical
#                              "quality"   -- coarse tie-break: a crafted item
#                                             sorts just ahead of a unique one;
#                                             every other quality ties under
#                                             this key. Mainly useful in a
#                                             mixed-quality category (like
#                                             uniqueGear, or unclassified).
#
#                            Keys accepted only by gear categories
#                            (uniqueGear, rareGear, magicGear, superiorGear,
#                            normalGear, unclassified):
#                              "gearGroup" -- slot/weapon-type bucket, in
#                                             the order that category's own
#                                             gear_groups (below) lists
#                              "handTier"  -- armor first, then one-handed
#                                             weapons, then two-handed
#
#                            Keys accepted only by "set":
#                              "setName"   -- alphabetical by the set's own
#                                             name; whole sets still stay
#                                             grouped together as one block
#                              "itemName"  -- within one set, alphabetical
#                                             by each piece's own item name
#
#                            Keys accepted only by "uniqueCharm" /
#                            "magicCharm":
#                              "size"      -- charm grid size (small/large/
#                                             grand); "-size" = grand first
#
#   gear_groups            -- gear categories only (uniqueGear, rareGear,
#                            magicGear, superiorGear, normalGear,
#                            unclassified). The order the "gearGroup" sort
#                            key above uses for THIS category -- each gear
#                            category can have its own order. List all 23
#                            keys in whatever order you want; a key you
#                            leave out falls back to its default position,
#                            behind every key you did list.
#                            Full list of 23 keys: helm, tors, belt, glov,
#                            boot, shld, axe, swor, knif, blun, scep, wand,
#                            staf, orb, spea, pole, jave, bow, bowq, xbow,
#                            xboq, h2h, weap.
#                            (bowq = Arrows, stays right after bow; xboq =
#                            Bolts, stays right after xbow -- unless you
#                            explicitly split them apart in your own list.)

[[item-sorting.shared_stash.layout]]
mode_id = "uniqueGear"
min_tabs = 5
add_empty_page_when = "never"
gear_groups = ["helm", "tors", "belt", "glov", "boot", "shld", "axe", "swor", "knif", "blun", "scep", "wand", "staf", "orb", "spea", "pole", "jave", "bow", "bowq", "xbow", "xboq", "h2h", "weap"]
sort_keys = ["handTier", "gearGroup", "quality", "reqLevel", "-ilvl", "name"]

[[item-sorting.shared_stash.layout]]
mode_id = "uniqueRingAmu"
min_tabs = 1
add_empty_page_when = "never"
sort_keys = ["quality", "reqLevel", "-ilvl", "name"]

[[item-sorting.shared_stash.layout]]
mode_id = "rareRingAmu"
min_tabs = 1
add_empty_page_when = "never"
sort_keys = ["reqLevel", "-ilvl", "name"]

[[item-sorting.shared_stash.layout]]
mode_id = "magicRingAmu"
min_tabs = 1
add_empty_page_when = "never"
sort_keys = ["reqLevel", "-ilvl", "name"]

[[item-sorting.shared_stash.layout]]
mode_id = "uniqueCharm"
min_tabs = 1
add_empty_page_when = "never"
sort_keys = ["-size", "quality", "reqLevel", "-ilvl", "name"]

[[item-sorting.shared_stash.layout]]
mode_id = "magicCharm"
min_tabs = 2
add_empty_page_when = "never"
sort_keys = ["-size", "reqLevel", "-ilvl", "name"]

[[item-sorting.shared_stash.layout]]
mode_id = "uniqueJewel"
min_tabs = 1
add_empty_page_when = "never"
sort_keys = ["quality", "reqLevel", "-ilvl", "name"]

[[item-sorting.shared_stash.layout]]
mode_id = "rareMagicJewel"
min_tabs = 1
add_empty_page_when = "never"
sort_keys = ["reqLevel", "-ilvl", "name"]

[[item-sorting.shared_stash.layout]]
mode_id = "set"
min_tabs = 6
# Always add a breathing page after Set gear -- its tabs tend to fill
# unevenly since full sets are rare.
add_empty_page_when = "always"
sort_keys = ["setName", "reqLevel", "-ilvl", "itemName"]

[[item-sorting.shared_stash.layout]]
mode_id = "rareGear"
min_tabs = 1
# Never add a breathing page after Rare gear -- with the quality-tier gear
# categories below it, it's no longer the last category by default, but it
# can still be the largest, so padding it is still just wasted tabs.
add_empty_page_when = "never"
gear_groups = ["helm", "tors", "belt", "glov", "boot", "shld", "axe", "swor", "knif", "blun", "scep", "wand", "staf", "orb", "spea", "pole", "jave", "bow", "bowq", "xbow", "xboq", "h2h", "weap"]
sort_keys = ["handTier", "gearGroup", "reqLevel", "-ilvl", "name"]

# NEW -- Magic-quality gear. Before this category existed, a magic-quality
# helm/weapon/etc had no dedicated category and fell all the way through to
# "unclassified" below; now it gets its own tab(s) like every other quality
# tier already had.
[[item-sorting.shared_stash.layout]]
mode_id = "magicGear"
min_tabs = 1
add_empty_page_when = "never"
gear_groups = ["helm", "tors", "belt", "glov", "boot", "shld", "axe", "swor", "knif", "blun", "scep", "wand", "staf", "orb", "spea", "pole", "jave", "bow", "bowq", "xbow", "xboq", "h2h", "weap"]
sort_keys = ["handTier", "gearGroup", "reqLevel", "-ilvl", "name"]

# NEW -- Superior-quality gear (same idea as magicGear above, one tier down).
[[item-sorting.shared_stash.layout]]
mode_id = "superiorGear"
min_tabs = 1
add_empty_page_when = "never"
gear_groups = ["helm", "tors", "belt", "glov", "boot", "shld", "axe", "swor", "knif", "blun", "scep", "wand", "staf", "orb", "spea", "pole", "jave", "bow", "bowq", "xbow", "xboq", "h2h", "weap"]
sort_keys = ["handTier", "gearGroup", "reqLevel", "-ilvl", "name"]

# NEW -- Normal/white-quality gear (same idea, the plain base-item tier).
[[item-sorting.shared_stash.layout]]
mode_id = "normalGear"
min_tabs = 1
add_empty_page_when = "never"
gear_groups = ["helm", "tors", "belt", "glov", "boot", "shld", "axe", "swor", "knif", "blun", "scep", "wand", "staf", "orb", "spea", "pole", "jave", "bow", "bowq", "xbow", "xboq", "h2h", "weap"]
sort_keys = ["handTier", "gearGroup", "reqLevel", "-ilvl", "name"]

# Catches every item that doesn't match any other category actually present
# in this layout list above -- including a category you've removed
# entirely, and anything this plugin doesn't classify at all (quest items,
# keys, potions, etc). Placed last so it never steals tabs from a real
# category ahead of it.
[[item-sorting.shared_stash.layout]]
mode_id = "unclassified"
min_tabs = 1
add_empty_page_when = "never"
gear_groups = ["helm", "tors", "belt", "glov", "boot", "shld", "axe", "swor", "knif", "blun", "scep", "wand", "staf", "orb", "spea", "pole", "jave", "bow", "bowq", "xbow", "xboq", "h2h", "weap"]
sort_keys = ["quality", "reqLevel", "name"]

# ═══════════════════════════════════════════════════════════════════════════
#  SINGLE-GRID SORTING: Personal Stash, Inventory, Horadric Cube
# ═══════════════════════════════════════════════════════════════════════════
# The shared stash's settings are above. The three sections below
# each sort one other container, with its own Sort button:
#   personal_stash -- button on the stash dialog's Personal tab (added to the
#                     mod's stash layout by tools/patch_mod_stash_layout.py;
#                     it also shows on the Shared tab, right of the shared-
#                     stash buttons, and always sorts the PERSONAL stash)
#   inventory      -- button on the inventory panel, bottom-left, next to
#                     the gold button (added by the plugin itself)
#   cube           -- button in the Horadric Cube panel and on the stash
#                     dialog's cube tab (added by patch_mod_stash_layout.py)
#
# ── How single-grid sorting differs from shared-stash sorting ──────────────
# The shared stash has many tabs, so each category gets its own tab(s)
# (min_tabs, add_empty_page_when). The personal stash, inventory and cube are
# each ONE grid with no spare tabs, so here a category gets an AREA of that
# grid instead. That's why min_tabs / add_empty_page_when do not exist below
# and zone / anchor / fill_direction / category_break exist instead.
#
# ── The three sections share one format ────────────────────────────────────
#   [item-sorting.personal_stash]   + [[...personal_stash.layout]]
#   [item-sorting.inventory]        + [[...inventory.layout]]
#   [item-sorting.cube]             + [[...cube.layout]]
# Every key below is accepted by all three sections. The only differences
# are the shipped default values. A key you leave out takes its shipped
# default; a section you leave out entirely uses the shipped defaults too.
# A key with an invalid value makes that container's Sort refuse to run
# (toast + the exact problem in the plugin log) -- it never guesses.
#
# ── Section keys ───────────────────────────────────────────────────────────
#
#   enabled          -- true | false. false makes that container's Sort
#                       button show a "disabled" toast instead of sorting.
#
#   grid_width       -- integer 1-16. Number of columns / rows of this
#   grid_height         container's grid. The SDK cannot query these, so
#                       they must match your mod. Shipped values are the
#                       Reimagined mod's sizes:
#                         personal stash 16 x 13, inventory 10 x 8,
#                         Horadric Cube 12 x 8.
#                       Vanilla D2R sizes, for reference:
#                         personal stash 10 x 10, inventory 10 x 4,
#                         Horadric Cube 3 x 4.
#                       Items found outside this grid (x + w > width or
#                       y + h > height) are left exactly where they are and
#                       listed in the plugin log; the rest is sorted inside
#                       width x height. If the log reports such items, your
#                       values are too small.
#
#   fill_direction   -- "columns" | "rows".
#                       "columns": fill one column completely (in the
#                         vertical direction the anchor points to), then
#                         move to the next column. Best for tall items
#                         (2x3 armor, 2x4 weapons): they stack neatly
#                         instead of leaving holes.
#                       "rows": fill one row completely, then move to the
#                         next row. Best for small 1x1 items (runes, gems).
#
#   category_break   -- "none" | "band".
#                       "none": the next layout entry continues right where
#                         the previous one stopped. Tightest packing.
#                       "band": each layout entry starts in a fresh column
#                         ("columns") or fresh row ("rows"), so categories
#                         never share a column/row. Easier to read, costs
#                         some space. Only applies between entries that
#                         share the same anchor and have no zone.
#
#   on_overflow      -- "compact" | "abort".
#                       Moving items into a new arrangement can fail to fit
#                       even when they all fit before (mixed item sizes
#                       leave holes). The whole plan -- including the order
#                       the items are moved in, one at a time, each onto
#                       free cells -- is computed and checked BEFORE any item
#                       moves. If the grid is too full to rearrange safely,
#                       nothing moves (toast + log).
#                       "compact": if the plan doesn't fit, retry once with
#                         category_break = "none"; if that still doesn't
#                         fit, abort.
#                       "abort": give up at once.
#                       Abort = toast + log line, no item moved.
#
#   locked_cells     -- list of rectangles { x, y, w, h } the plugin never
#                       touches. x and y are 0-based (0,0 = top-left cell);
#                       w and h are sizes in cells, >= 1. The rectangle must
#                       fit inside the grid: x + w <= grid_width,
#                       y + h <= grid_height. Any item overlapping a locked
#                       rectangle, even by one cell, stays exactly where it
#                       is, and no item is ever moved into a locked cell.
#                       [] = nothing locked. Example, lock the two
#                       right-most columns of a 16-wide grid:
#                         locked_cells = [ { x = 14, y = 0, w = 2, h = 13 } ]
#
#   keep_in_place    -- list of mode_ids (see the full list below). Items of
#                       these modes stay exactly where they are, wherever
#                       they sit in the grid; other items are arranged
#                       around them. A mode_id listed here must NOT also
#                       appear in this section's layout. Listing
#                       "unclassified" here keeps every item that no layout
#                       entry claims in place. [] = move everything.
#
# ── Layout entry keys ([[...layout]]) ──────────────────────────────────────
# One entry per category. Entries with a zone are placed first, then the
# rest, each group in list order. An item goes to the FIRST entry (in list
# order) whose mode matches it.
#
#   mode_id          -- one mode, e.g. mode_id = "rune"
#   mode_ids         -- several modes merged into ONE category, e.g.
#                       mode_ids = ["uniqueCharm", "magicCharm"]
#                       Set exactly one of mode_id / mode_ids per entry.
#                       Within one section a mode may appear in only one
#                       entry. A duplicate is a config error (toast, no sort).
#
#   anchor           -- "topLeft" | "topRight" | "bottomLeft" | "bottomRight".
#                       Default "topLeft". The corner this category starts
#                       filling from; it grows from there toward the middle.
#                       Categories with different anchors grow toward each
#                       other, so the free space stays in the middle as one
#                       connected block.
#
#   zone             -- optional rectangle { x, y, w, h } (same rules as
#                       locked_cells). This category is placed only inside
#                       that rectangle, starting from its anchor corner of
#                       the zone. If the zone fills up, the remaining items
#                       spill into the rest of the grid (outside every
#                       zone) from the same anchor corner of the grid.
#                       Leave it out to use the whole grid minus every
#                       zone. Zones must not overlap each other or
#                       locked_cells.
#
#   sort_keys        -- this category's sort order, most significant key
#                       first; prefix "-" for descending. Optional: without
#                       it the entry uses the built-in default order of its
#                       first mode. An unknown key name is a config error
#                       (toast, no sort). A key that doesn't apply to an
#                       item (e.g. "gemGrade" on a sword) just ties.
#                       Keys for any item:
#                         "reqLevel"  required level
#                         "ilvl"      item level
#                         "name"      base item name, alphabetical
#                         "quality"   crafted just ahead of unique; other
#                                     qualities tie
#                         "area"      item size in cells (w x h).
#                                     "-area" = biggest first. Recommended
#                                     as the first key for mixed-size
#                                     categories in a small grid: it reduces
#                                     holes and therefore overflow.
#                         "height"    item height in cells ("-height" =
#                                     tallest first)
#                       Gear keys (same meaning as in the shared-stash
#                       layout): "gearGroup", "handTier"
#                       Set keys: "setName", "itemName"
#                       Charm key: "size"  (small < large < grand)
#                       Rune key: "runeNumber"  El = 1 ... Zod = 33 (a mod
#                                 rune uses the number in its code, rNN; a
#                                 Reimagined rune stack sorts right after
#                                 its single rune)
#                       Gem keys: "gemType"   amethyst, topaz, sapphire,
#                                             emerald, ruby, diamond, skull,
#                                             chaos onyx
#                                 "gemGrade"  chipped < flawed < normal <
#                                             flawless < perfect <
#                                             Reimagined special gem < stack
#                       Potion keys: "potionType"  healing, mana,
#                                                  rejuvenation, stamina,
#                                                  antidote, thawing
#                                    "potionGrade" minor/small < light/large
#                                                  < normal < greater <
#                                                  super < full
#
#   gear_groups      -- gear modes only. Same 23 keys and same meaning as
#                       in the shared-stash layout.
#
# ── mode_id values ─────────────────────────────────────────────────────────
#   Same as the shared stash:
#     set, uniqueGear, rareGear, magicGear, superiorGear, normalGear,
#     uniqueCharm, magicCharm, uniqueJewel, rareMagicJewel,
#     uniqueRingAmu, rareRingAmu, magicRingAmu, unclassified
#   Misc categories (also accepted in the shared-stash layout above):
#     rune     -- runes (El ... Zod, mod runes, Reimagined rune stacks)
#     gem      -- gems and skulls of every grade, Reimagined gem stacks
#     potion   -- healing / mana / rejuvenation / stamina / antidote /
#                 thawing potions (and mod potions of those types)
#     tool     -- Horadric Cube, Tome of Town Portal / Identify, loose
#                 scrolls, keys, Reimagined storage items and grabbers
#     quest    -- quest items and body parts (Horadric staff parts,
#                 Khalim's parts, uber keys and organs, ...)
#   In these three sections the gear modes only take items that really are
#   gear (a helm/armor/weapon slot). Everything else that isn't a charm,
#   jewel, ring, amulet or one of the misc categories -- e.g. Reimagined's
#   orbs, elixirs and dyes -- goes to "unclassified".
#   "unclassified" catches every item no other entry in THIS section
#   claimed. If a section has no "unclassified" entry, those items stay
#   where they are, like keep_in_place.
#
# ── Hot reload ─────────────────────────────────────────────────────────────
# Every Sort press re-reads these sections from disk, `enabled` included --
# no restart needed for anything here.
#
# ── Things these sections cannot do ────────────────────────────────────────
#   - Equipped items and the belt: the SDK rejects moves there, so they are
#     never sorted.
#   - Moving items BETWEEN containers (e.g. inventory -> stash): out of
#     scope. Each Sort button only rearranges its own container.


# ═══════════════════════════════════════════════════════════════════════════
#  PERSONAL STASH
# ═══════════════════════════════════════════════════════════════════════════
[item-sorting.personal_stash]
enabled = true
grid_width = 16
grid_height = 13
fill_direction = "columns"
category_break = "band"
on_overflow = "compact"
locked_cells = []
keep_in_place = []

# Runes always live in the two right-most columns, El at the top.
[[item-sorting.personal_stash.layout]]
mode_id = "rune"
anchor = "topRight"
zone = { x = 14, y = 0, w = 2, h = 13 }
sort_keys = ["runeNumber"]

[[item-sorting.personal_stash.layout]]
mode_id = "gem"
sort_keys = ["gemType", "-gemGrade"]

[[item-sorting.personal_stash.layout]]
mode_ids = ["uniqueCharm", "magicCharm"]
sort_keys = ["-size", "quality", "reqLevel", "name"]

[[item-sorting.personal_stash.layout]]
mode_ids = ["uniqueJewel", "rareMagicJewel", "uniqueRingAmu", "rareRingAmu", "magicRingAmu"]
sort_keys = ["quality", "reqLevel", "name"]

[[item-sorting.personal_stash.layout]]
mode_ids = ["uniqueGear", "set", "rareGear", "magicGear", "superiorGear", "normalGear"]
gear_groups = ["helm", "tors", "belt", "glov", "boot", "shld", "axe", "swor", "knif", "blun", "scep", "wand", "staf", "orb", "spea", "pole", "jave", "bow", "bowq", "xbow", "xboq", "h2h", "weap"]
sort_keys = ["-area", "handTier", "gearGroup", "quality", "reqLevel"]

# Potions, tools, quest items and anything else.
[[item-sorting.personal_stash.layout]]
mode_id = "unclassified"
anchor = "bottomLeft"
sort_keys = ["-area", "name"]


# ═══════════════════════════════════════════════════════════════════════════
#  INVENTORY
# ═══════════════════════════════════════════════════════════════════════════
[item-sorting.inventory]
enabled = true
grid_width = 10
grid_height = 8
fill_direction = "columns"
category_break = "none"
on_overflow = "abort"
locked_cells = []

# Charms are arranged by hand and never moved by the plugin. Remove this
# (keep_in_place = []) and enable the charm entry below to have the plugin
# sort charms too.
keep_in_place = ["uniqueCharm", "magicCharm"]

# Horadric Cube, tomes, scrolls, keys: top-right corner.
[[item-sorting.inventory.layout]]
mode_id = "tool"
anchor = "topRight"
sort_keys = ["-area", "name"]

# Everything you pick up: top-left corner, so the free block stays in the
# middle/right for more looting.
[[item-sorting.inventory.layout]]
mode_id = "unclassified"
anchor = "topLeft"
sort_keys = ["-area", "quality", "name"]

# Optional -- only if charms are removed from keep_in_place above:
# [[item-sorting.inventory.layout]]
# mode_ids = ["uniqueCharm", "magicCharm"]
# anchor = "bottomRight"
# sort_keys = ["-size", "quality"]


# ═══════════════════════════════════════════════════════════════════════════
#  HORADRIC CUBE
# ═══════════════════════════════════════════════════════════════════════════
[item-sorting.cube]
enabled = true
grid_width = 12
grid_height = 8
fill_direction = "rows"
category_break = "none"
on_overflow = "compact"
locked_cells = []
keep_in_place = []

[[item-sorting.cube.layout]]
mode_id = "rune"
sort_keys = ["runeNumber"]

[[item-sorting.cube.layout]]
mode_id = "gem"
sort_keys = ["gemType", "-gemGrade"]

[[item-sorting.cube.layout]]
mode_id = "unclassified"
sort_keys = ["-area", "name"]

# This plugin only rearranges the local player's own shared stash, personal
# stash, inventory and cube, so its settings do not affect other players and
# are not listed under [d2rl].
